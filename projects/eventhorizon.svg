<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="30%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#060709"/>

  <!-- Star particles background -->
  <g opacity="0.4">
    <circle cx="120" cy="150" r="1.5" fill="#fff"/>
    <circle cx="340" cy="80" r="1" fill="#fff"/>
    <circle cx="920" cy="210" r="1.5" fill="#fff"/>
    <circle cx="1050" cy="120" r="2" fill="#fff"/>
    <circle cx="150" cy="620" r="1" fill="#fff"/>
    <circle cx="1020" cy="580" r="1.5" fill="#fff"/>
    <circle cx="480" cy="680" r="1" fill="#fff"/>
    <circle cx="820" cy="640" r="2" fill="#fff"/>
  </g>

  <!-- Relativistic Lensing Accretion Disk Simulation Graphic -->
  <g transform="translate(600, 375)">
    <!-- Outer Glow -->
    <ellipse rx="420" ry="140" fill="url(#bhGlow)" transform="rotate(-12)"/>
    
    <!-- Bent Light Top Arc (Gravitational Lensing) -->
    <path d="M -320 -20 C -260 -180 260 -180 320 -20" fill="none" stroke="url(#diskGrad)" stroke-width="28" stroke-linecap="round" opacity="0.85" filter="blur(2px)"/>
    <path d="M -260 -15 C -200 -140 200 -140 260 -15" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

    <!-- Accretion Disk Front Ring -->
    <ellipse rx="380" ry="70" fill="none" stroke="url(#diskGrad)" stroke-width="32" transform="rotate(-12)"/>
    <ellipse rx="340" ry="55" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(-12)" opacity="0.75"/>

    <!-- Black Hole Center Shadow (Event Horizon) -->
    <circle cx="0" cy="0" r="130" fill="#000000"/>
    <circle cx="0" cy="0" r="132" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    
    <!-- Photon Sphere Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" stroke-dasharray="8, 4"/>
  </g>

  <!-- Technical Overlay HUD -->
  <text x="60" y="70" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12" letter-spacing="3">RAYMARCHING // SCHWARZSCHILD METRIC</text>
  <text x="1140" y="70" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="12">FPS: 60.0 // FP32</text>
  <text x="60" y="700" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="1">EVENT HORIZON SIMULATION</text>
  <text x="1140" y="700" text-anchor="end" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="14">THREE.JS • GLSL SHADERS • WEBGL 2.0</text>
</svg>
